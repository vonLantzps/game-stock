<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Fallout games and projects for Android.">
<title>Fallout on Android</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e13;
  --surface:#151b23;
  --line:#2c3745;
  --text:#f2f5fa;
  --accent:#a8e063;
  --accent-hover:#c4ee8d;
  --max:1120px;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
.wrap{width:min(var(--max),calc(100% - 40px));margin:0 auto}
.site-header{
  min-height:150px;
  display:flex;
  align-items:center;
  border-bottom:1px solid var(--line);
  background:linear-gradient(110deg,#111a18,#0b0e13 70%);
}
.site-title{
  margin:0;
  color:var(--text);
  font-family:"Anton",Impact,sans-serif;
  font-size:clamp(2.7rem,7vw,5.2rem);
  font-weight:400;
  line-height:1;
  letter-spacing:.025em;
  text-transform:uppercase;
}
.site-title span{color:var(--accent)}
main{padding:46px 0 70px}
.game-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),340px));
  gap:24px;
  align-items:start;
}
.game-card{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--surface);
  transition:transform .2s ease,border-color .2s ease;
}
.game-card:hover{
  transform:translateY(-4px);
  border-color:#607b45;
}
.cover{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#252b2c;
}
.card-content{padding:18px}
.game-title{
  margin:0 0 17px;
  font-size:1.35rem;
  line-height:1.25;
  font-weight:750;
}
.download-button{
  display:flex;
  width:100%;
  min-height:48px;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border:0;
  border-radius:10px;
  background:var(--accent);
  color:#11180c;
  font-size:1rem;
  font-weight:800;
  text-decoration:none;
  text-align:center;
  transition:background .15s ease,transform .15s ease;
}
.download-button:hover{
  background:var(--accent-hover);
  transform:translateY(-1px);
}
@media(max-width:600px){
  .site-header{min-height:120px}
  main{padding-top:28px}
  .game-grid{grid-template-columns:1fr}
  .game-card{width:min(100%,420px)}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1 class="site-title">Fallout <span>on Android</span></h1>
  </div>
</header>

<main class="wrap">
  <section class="game-grid" aria-label="Available games">
    <article class="game-card">
      <img
        class="cover"
        src="Follout%20Sonora.webp"
        alt="Fallout: Sonora cover art"
      >
      <div class="card-content">
        <h2 class="game-title">Fallout: Sonora</h2>
        <a
          class="download-button"
          href="https://github.com/HogLord69/fallout-english-localization/releases/download/v1.0/Fallout-Sonora-English.zip"
          download="Fallout-Sonora-English.zip"
        >Download archive</a>
      </div>
    </article>
  </section>
</main>
</body>
</html>
